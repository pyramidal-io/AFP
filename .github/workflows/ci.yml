name: Public CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release-changelog:
    if: startsWith(github.ref, 'refs/tags/')
    name: Release changelog alignment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Check release changelog alignment
        run: .github/scripts/check-release-changelog.py --tag "$GITHUB_REF_NAME"

  public-surface:
    name: Policy inventory & workflow pins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Check public surface
        run: .github/scripts/check-public-surface.sh
      - name: Download checksum-pinned Gitleaks 8.30.1
        run: set -euo pipefail; mkdir -p "$RUNNER_TEMP/gitleaks-v8.30.1"; curl --fail --location --silent --show-error --output "$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz; echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum --check --strict -; tar --extract --gzip --file "$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz" --directory "$RUNNER_TEMP/gitleaks-v8.30.1"; test "$("$RUNNER_TEMP/gitleaks-v8.30.1/gitleaks" version)" = "8.30.1"; echo "$RUNNER_TEMP/gitleaks-v8.30.1" >> "$GITHUB_PATH"
      - name: Download checksum-pinned TruffleHog 3.97.0
        run: set -euo pipefail; mkdir -p "$RUNNER_TEMP/trufflehog-v3.97.0"; curl --fail --location --silent --show-error --output "$RUNNER_TEMP/trufflehog_3.97.0_linux_amd64.tar.gz" https://github.com/trufflesecurity/trufflehog/releases/download/v3.97.0/trufflehog_3.97.0_linux_amd64.tar.gz; echo "62224de2f9dd7cd418800feb953760a302ed2f82a7c547fe1146a4874fb179e4  $RUNNER_TEMP/trufflehog_3.97.0_linux_amd64.tar.gz" | sha256sum --check --strict -; tar --extract --gzip --file "$RUNNER_TEMP/trufflehog_3.97.0_linux_amd64.tar.gz" --directory "$RUNNER_TEMP/trufflehog-v3.97.0"; test "$("$RUNNER_TEMP/trufflehog-v3.97.0/trufflehog" --version)" = "trufflehog 3.97.0"; echo "$RUNNER_TEMP/trufflehog-v3.97.0" >> "$GITHUB_PATH"
      - name: Check public license inventory
        run: .github/scripts/check-public-license-inventory.py
      - name: Check dependency boundary
        run: .github/scripts/check-public-dependencies.py
      - name: Check public provenance boundary
        run: .github/scripts/check-public-provenance.py
      - name: Download checksum-pinned Nargo v1.0.0-beta.22
        run: set -euo pipefail; mkdir -p "$RUNNER_TEMP/nargo-v1.0.0-beta.22"; curl --fail --location --silent --show-error --output "$RUNNER_TEMP/nargo-v1.0.0-beta.22.tar.gz" https://github.com/noir-lang/noir/releases/download/v1.0.0-beta.22/nargo-x86_64-unknown-linux-gnu.tar.gz; echo "384c4fc800905b213e26aabd738a96a4a85b1a76ffc27fb19aeb6d33494a787b  $RUNNER_TEMP/nargo-v1.0.0-beta.22.tar.gz" | sha256sum --check --strict -; tar --extract --gzip --file "$RUNNER_TEMP/nargo-v1.0.0-beta.22.tar.gz" --directory "$RUNNER_TEMP/nargo-v1.0.0-beta.22"; "$RUNNER_TEMP/nargo-v1.0.0-beta.22/nargo" --version | grep -Fq "nargo version = 1.0.0-beta.22"; echo "$RUNNER_TEMP/nargo-v1.0.0-beta.22" >> "$GITHUB_PATH"
      - name: Test vendored Noir conformance package
        working-directory: conformance/noir
        run: nargo test --workspace
      - name: Test public reference packages
        run: python3.12 -m unittest discover -s tests/python -t tests/python -v
      - name: Scan for committed secrets
        run: '"$RUNNER_TEMP/gitleaks-v8.30.1/gitleaks" dir . --config .gitleaks.toml --redact=100 --ignore-gitleaks-allow --no-banner'
      - name: Scan public tree with TruffleHog
        run: set -euo pipefail; TRUFFLEHOG_CAPTURE=$(mktemp "$RUNNER_TEMP/trufflehog-ci.XXXXXX"); if "$RUNNER_TEMP/trufflehog-v3.97.0/trufflehog" filesystem --directory . --no-update --no-verification --fail --fail-on-scan-errors --json --log-level=-1 > "$TRUFFLEHOG_CAPTURE" 2>&1; then if test -s "$TRUFFLEHOG_CAPTURE"; then rm -f "$TRUFFLEHOG_CAPTURE"; echo "::error::TruffleHog scan failed"; exit 1; fi; else rm -f "$TRUFFLEHOG_CAPTURE"; echo "::error::TruffleHog scan failed"; exit 1; fi; rm -f "$TRUFFLEHOG_CAPTURE"
